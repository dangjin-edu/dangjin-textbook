<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>디지털 교과서 스튜디오</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <!-- PDF.js (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <div class="app-shell" id="appShell">
    <!-- Top Header Bar -->
    <header class="top-bar">
      <div class="top-bar__left">
        <span class="brand-badge">WEB 교과서</span>
        <input
          id="bookTitleInput"
          class="book-title-input"
          type="text"
          value="2026 우리 고장 당진"
          aria-label="교과서 제목"
          readonly
        />
        <span id="cloudStatusBadge" class="cloud-badge" hidden>연결 확인 중...</span>
      </div>

      <div class="top-bar__right">
        <!-- Editor-only actions (hidden in clean Observer view) -->
        <div id="editorHeaderActions" class="editor-header-actions" hidden>
          <label class="btn btn--secondary btn--file" for="pdfUploadInput" title="내 PC의 PDF 파일 미리보기">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            PDF 열기
          </label>
          <input id="pdfUploadInput" type="file" accept="application/pdf" hidden />

          <button id="cloudSaveBtn" class="btn btn--cloud" type="button" title="편집 내용을 Firebase 클라우드에 저장">
            클라우드 저장
          </button>

          <button id="exportJsonBtn" class="btn btn--ghost" type="button" title="배치 데이터(JSON) 내보내기">
            JSON 백업
          </button>
          <label class="btn btn--ghost btn--file" for="importJsonInput" title="JSON 데이터 불러오기">
            불러오기
          </label>
          <input id="importJsonInput" type="file" accept="application/json" hidden />

          <button id="resetDemoBtn" class="btn btn--ghost" type="button" title="기본 시안으로 초기화">
            초기화
          </button>

          <button id="logoutBtn" class="btn btn--ghost" type="button" title="관리자 로그아웃" hidden>
            로그아웃
          </button>

          <button id="exitEditorBtn" class="btn btn--ghost" type="button">
            관찰자 보기
          </button>
        </div>

        <!-- Single entry button shown in Observer view -->
        <button id="enterEditorBtn" class="btn btn--editor-entry" type="button">
          <span class="mode-dot mode-dot--editor"></span>
          편집자 모드
        </button>
      </div>
    </header>

    <!-- Editor Palette Bar (visible only in Editor Mode) -->
    <div id="editorToolbar" class="editor-toolbar" hidden>
      <div class="editor-toolbar__group">
        <span class="editor-toolbar__label">버튼 배치:</span>
        <button class="tool-pill" data-tool="video" type="button">
          <span class="hotspot-preview hotspot-preview--video">▶</span>
          영상 링크
        </button>
        <button class="tool-pill" data-tool="article" type="button">
          <span class="hotspot-preview hotspot-preview--article">🌐</span>
          기사/웹 링크
        </button>
        <button class="tool-pill" data-tool="answer_text" type="button">
          <span class="hotspot-preview hotspot-preview--answer">?</span>
          정답(텍스트)
        </button>
        <button class="tool-pill" data-tool="answer_image" type="button">
          <span class="hotspot-preview hotspot-preview--answer-img">🖼</span>
          정답(이미지)
        </button>
      </div>

      <div class="editor-toolbar__pdf">
        <label for="pdfPathInput" class="editor-toolbar__label">배포 PDF 경로:</label>
        <input
          id="pdfPathInput"
          class="pdf-path-input"
          type="text"
          placeholder="./books/dangjin.pdf"
          title="GitHub 저장소 books 폴더에 올린 PDF 경로"
        />
        <button id="applyPdfPathBtn" class="btn btn--ghost" type="button">적용</button>
      </div>

      <div class="editor-toolbar__hint" id="editorHint">
        도구 선택 후 페이지를 클릭하세요. 기존 버튼은 클릭해 편집하거나 드래그로 이동합니다.
      </div>
    </div>

    <!-- Main Workspace -->
    <main class="workspace">
      <!-- Thumbnail / Page Management Drawer -->
      <aside id="thumbnailDrawer" class="thumbnail-drawer" hidden>
        <div class="drawer-header">
          <strong>페이지 관리</strong>
          <button id="closeDrawerBtn" class="icon-btn" type="button" aria-label="닫기">✕</button>
        </div>
        <div id="thumbnailList" class="thumbnail-list"></div>
        <div id="deletedPagesSection" class="deleted-pages-section" hidden>
          <div class="deleted-pages-header">
            <span>삭제된 페이지</span>
            <button id="restoreAllPagesBtn" class="link-btn" type="button">전체 복구</button>
          </div>
          <div id="deletedPagesList" class="deleted-pages-list"></div>
        </div>
      </aside>

      <!-- Book Stage -->
      <section class="book-stage" id="bookStage">
        <button id="prevSpreadBtn" class="side-nav-btn side-nav-btn--prev" type="button" aria-label="이전 페이지">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>

        <div class="book-frame" id="bookFrame">
          <div class="book-zoom-wrap" id="bookZoomWrap">
            <div class="book-spread" id="bookSpread">
              <!-- Decorative Bookmark Ribbons -->
              <div class="bookmark-ribbon bookmark-ribbon--left" aria-hidden="true"></div>
              <div class="bookmark-ribbon bookmark-ribbon--right" aria-hidden="true"></div>

              <!-- Left Page -->
              <div class="page-slot" id="leftPageSlot" data-side="left">
                <div class="page-surface" id="leftPageSurface">
                  <canvas id="leftCanvas" class="page-canvas"></canvas>
                  <div id="leftSamplePage" class="sample-page-layer"></div>
                  <div id="leftOverlay" class="hotspot-overlay" data-side="left"></div>
                </div>
                <button id="deleteLeftPageBtn" class="page-delete-btn" type="button" title="이 페이지 삭제">페이지 삭제</button>
                <span class="page-num-badge page-num-badge--left" id="leftPageNum">1</span>
              </div>

              <!-- Spine Shadow -->
              <div class="book-spine" id="bookSpine" aria-hidden="true"></div>

              <!-- Right Page -->
              <div class="page-slot" id="rightPageSlot" data-side="right">
                <div class="page-surface" id="rightPageSurface">
                  <canvas id="rightCanvas" class="page-canvas"></canvas>
                  <div id="rightSamplePage" class="sample-page-layer"></div>
                  <div id="rightOverlay" class="hotspot-overlay" data-side="right"></div>
                </div>
                <button id="deleteRightPageBtn" class="page-delete-btn" type="button" title="이 페이지 삭제">페이지 삭제</button>
                <span class="page-num-badge page-num-badge--right" id="rightPageNum">2</span>
              </div>
            </div>
          </div>
        </div>

        <button id="nextSpreadBtn" class="side-nav-btn side-nav-btn--next" type="button" aria-label="다음 페이지">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </section>

      <!-- Editor Inspector Panel (visible when a hotspot is selected in Editor Mode) -->
      <aside id="inspectorPanel" class="inspector-panel" hidden>
        <div class="inspector-header">
          <h3>버튼 속성 편집</h3>
          <button id="closeInspectorBtn" class="icon-btn" type="button" aria-label="닫기">✕</button>
        </div>

        <form id="inspectorForm" class="inspector-form">
          <div class="form-field">
            <label for="propType">기능 종류</label>
            <select id="propType">
              <option value="video">영상 링크 (재생 버튼)</option>
              <option value="article">신문기사 / 웹 링크 (지구본)</option>
              <option value="answer_text">정답 보여주기 (텍스트)</option>
              <option value="answer_image">정답 보여주기 (이미지)</option>
            </select>
          </div>

          <div class="form-field">
            <label for="propTitle">버튼 이름 / 툴팁</label>
            <input id="propTitle" type="text" placeholder="예: 무자위 설명 영상" />
          </div>

          <!-- Video / Article URL -->
          <div class="form-field" id="urlFieldGroup">
            <label for="propUrl" id="propUrlLabel">연결 URL</label>
            <input id="propUrl" type="url" placeholder="https://..." />
          </div>

          <!-- Article Note -->
          <div class="form-field" id="noteFieldGroup" hidden>
            <label for="propNote">간단 요약 (선택)</label>
            <textarea id="propNote" rows="3" placeholder="학생들에게 보여줄 기사 요약이나 안내 문구"></textarea>
          </div>

          <!-- Answer Text -->
          <div class="form-field" id="answerFieldGroup" hidden>
            <label for="propAnswer" id="propAnswerLabel">정답 텍스트</label>
            <input id="propAnswer" type="text" placeholder="예: 병원" />
          </div>

          <!-- Answer Image -->
          <div class="form-field" id="answerImageGroup" hidden>
            <label>정답 이미지</label>
            <div class="image-upload-row">
              <label class="btn btn--secondary btn--file" for="propAnswerImageInput">
                이미지 불러오기
              </label>
              <input id="propAnswerImageInput" type="file" accept="image/*" hidden />
              <button id="clearAnswerImageBtn" class="btn btn--ghost" type="button" hidden>제거</button>
            </div>
            <div id="answerImagePreviewWrap" class="answer-image-preview-wrap" hidden>
              <img id="answerImagePreview" alt="정답 이미지 미리보기" />
              <div class="answer-size-hint" id="answerBoxSizeLabel">
                크기: 가로 30% (페이지에서 모서리 ↘ 드래그로 조절)
              </div>
            </div>
          </div>

          <div class="form-field" id="answerStyleGroup" hidden>
            <label for="propAnswerStyle">정답 표시 방식</label>
            <select id="propAnswerStyle">
              <option value="inline">제자리에서 ?가 정답으로 전환</option>
              <option value="modal">해설 포함 팝업 창으로 표시</option>
            </select>
          </div>

          <div class="form-field">
            <label for="propSize">버튼 크기 (<span id="propSizeVal">1.0</span>x)</label>
            <input id="propSize" type="range" min="0.7" max="1.6" step="0.1" value="1.0" />
          </div>

          <div class="form-coords" id="propCoords">위치: 1쪽 · X 0%, Y 0%</div>

          <div class="inspector-actions">
            <button id="testHotspotBtn" class="btn btn--secondary" type="button">미리보기 테스트</button>
            <button id="deleteHotspotBtn" class="btn btn--danger" type="button">삭제</button>
          </div>
        </form>
      </aside>
    </main>

    <!-- Bottom Viewer Controls Bar -->
    <footer class="bottom-bar">
      <div class="bottom-bar__group">
        <button id="toggleDrawerBtn" class="tool-icon-btn" type="button" title="페이지 목록 / 삭제 관리">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <button id="zoomOutBtn" class="tool-icon-btn" type="button" title="축소">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
        <span id="zoomLabel" class="zoom-label">100%</span>
        <button id="zoomInBtn" class="tool-icon-btn" type="button" title="확대">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
        <button id="zoomResetBtn" class="tool-icon-btn" type="button" title="화면 맞춤 (위치 초기화)">1:1</button>
      </div>

      <div class="bottom-bar__group bottom-bar__pager">
        <button id="firstPageBtn" class="tool-icon-btn" type="button" title="첫 페이지">|&lt;</button>
        <button id="prevPageBtn" class="tool-icon-btn" type="button" title="이전">&lt;</button>
        <span id="pageIndicator" class="page-indicator">1 - 2 / 6</span>
        <button id="nextPageBtn" class="tool-icon-btn" type="button" title="다음">&gt;</button>
        <button id="lastPageBtn" class="tool-icon-btn" type="button" title="마지막 페이지">&gt;|</button>
      </div>

      <div class="bottom-bar__group">
        <button id="toggleLayoutBtn" class="tool-icon-btn" type="button" title="양면/단면 보기 전환">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
          <span id="layoutLabel">양면</span>
        </button>
        <button id="revealAllAnswersBtn" class="tool-icon-btn" type="button" title="현재 펼침면 정답 모두 보기/숨기기">
          정답 일괄 보기
        </button>
        <button id="fullscreenBtn" class="tool-icon-btn" type="button" title="전체화면">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- Interactive Content Modal (Video / Article / Answer Detail) -->
  <div id="contentModal" class="modal-backdrop" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <span id="modalBadge" class="modal-badge">영상</span>
          <h2 id="modalTitle">제목</h2>
        </div>
        <button id="closeModalBtn" class="icon-btn" type="button" aria-label="창 닫기">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalFooter" class="modal-footer"></div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast" hidden></div>

  <script src="firebase-config.js"></script>
  <script src="sample-data.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
